name: Build ClipForge Studio (.apk + .exe)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android-apk:
    name: Android .apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web folder for Capacitor
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Add Android platform and sync web app
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK (test-signed, installable)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-Studio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows-exe:
    name: Windows .exe installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows NSIS installer (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Upload EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-Studio-EXE
          path: dist/*.exe
